<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
  <rect width="1400" height="980" fill="#3d4a2c"/>
  <!-- rivière -->
  <path d="M0 900 C 300 860 500 960 800 910 S 1200 870 1400 920 V980 H0 Z" fill="#2f5d7c"/>
  <!-- rez-de-chaussée -->
  <rect x="70" y="70" width="560" height="700" fill="#8c7a5b" stroke="#2e2a24" stroke-width="22"/>
  <rect x="300" y="760" width="100" height="30" fill="#5a3d22"/>
  <circle cx="350" cy="300" r="110" fill="#9a9a9a" stroke="#5c5c5c" stroke-width="12"/>
  <circle cx="350" cy="300" r="18" fill="#5c5c5c"/>
  <g fill="#d9c79a" stroke="#8a7650" stroke-width="4">
    <ellipse cx="140" cy="640" rx="40" ry="30"/><ellipse cx="200" cy="680" rx="40" ry="30"/><ellipse cx="150" cy="700" rx="40" ry="30"/>
  </g>
  <rect x="480" y="560" width="90" height="90" fill="#4a3320" stroke="#21170d" stroke-width="8"/>
  <text x="525" y="690" font-family="Georgia, serif" font-size="22" fill="#f4e6c8" text-anchor="middle">trappe</text>
  <text x="350" y="470" font-family="Georgia, serif" font-size="30" fill="#f4e6c8" text-anchor="middle">Meules</text>
  <text x="350" y="50" font-family="Georgia, serif" font-size="30" fill="#f4e6c8" text-anchor="middle">Moulin — rez-de-chaussée</text>
  <!-- roue -->
  <circle cx="660" cy="250" r="70" fill="none" stroke="#5a3d22" stroke-width="16"/>
  <!-- cave -->
  <rect x="770" y="70" width="560" height="700" fill="#2a2622" stroke="#15120f" stroke-width="22"/>
  <rect x="800" y="560" width="80" height="80" fill="#4a3320"/>
  <text x="840" y="680" font-family="Georgia, serif" font-size="22" fill="#cbb98f" text-anchor="middle">échelle</text>
  <g fill="#5b4a33"><rect x="1000" y="120" width="70" height="70"/><rect x="1080" y="130" width="60" height="60"/></g>
  <rect x="1180" y="690" width="120" height="80" fill="#15120f"/>
  <text x="1240" y="665" font-family="Georgia, serif" font-size="20" fill="#cbb98f" text-anchor="middle">tunnel</text>
  <rect x="1200" y="140" width="110" height="130" fill="none" stroke="#777" stroke-width="6" stroke-dasharray="4 10"/>
  <text x="1255" y="300" font-family="Georgia, serif" font-size="20" fill="#cbb98f" text-anchor="middle">cage</text>
  <circle cx="1050" cy="400" r="45" fill="#6a2e8a" opacity="0.55"/>
  <text x="1050" y="470" font-family="Georgia, serif" font-size="20" fill="#cbb98f" text-anchor="middle">pierre-lune</text>
  <text x="1050" y="50" font-family="Georgia, serif" font-size="30" fill="#f4e6c8" text-anchor="middle">Cave</text>
