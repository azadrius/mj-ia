services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mjia
      POSTGRES_PASSWORD: mjia
      POSTGRES_DB: mjia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  piper:
    build: ./docker/piper
    ports:
      - "5000:5000"
    restart: unless-stopped
volumes:
  pgdata:
